name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Genera el cliente de Prisma (no se conecta a ninguna base de datos).
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
